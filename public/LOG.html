<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dom-US LOG dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 900px;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 5px;
        }
        .config-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-top: 35px;
            border: 1px solid #e2e8f0;
        }
        .config-box input {
            padding: 8px;
            margin: 5px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-size: 13px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }
        th {
            background-color: #2c3e50;
            color: white;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
        .center {
            text-align: center;
            font-size: 1.1em;
        }
        .refresh-btn {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            transition: background-color 0.2s;
        }
        .refresh-btn:hover {
            background-color: #2980b9;
        }
        hr {
            border: 0;
            height: 1px;
            background: #dcdde1;
            margin: 35px 0;
        }
        .loading {
            text-align: center;
            color: #e67e22;
            font-weight: bold;
            display: none;
            margin-top: 15px;
            padding: 10px;
            background-color: #fef5e7;
            border-radius: 6px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>dom-US LOG</h1>
    
    <button class="refresh-btn" onclick="fetchLogs()">refresh</button>
    
    <div id="loading-status" class="loading">Connessione a Supabase in corso...</div>

    <table>
        <thead>
            <tr>
                <!-- <th style="width: 10%;">ID</th> -->
                <th style="width: 25%;">Date & Time</th>
                <th style="width: 15%; text-align: center;">Severity</th>
                <th>Event Message</th>
            </tr>
        </thead>
        <tbody id="log-table-body">
            <tr><td colspan="4" class="center">Configura le credenziali in basso per caricare i log.</td></tr>
        </tbody>
    </table>

    <hr>

    <div class="config-box">
        <strong>Supabase Config:</strong><br>
        <input type="text" id="sb-url" placeholder="Supabase URL (https://xyz.supabase.co)" style="width: 320px;">
        <input type="password" id="sb-key" placeholder="Supabase Anon Key" style="width: 320px;">
        <button onclick="saveConfig()" style="padding: 8px 20px; font-size: 13px; background-color: #34495e; color: white; border: none; border-radius: 4px; cursor: pointer;">Save</button>
    </div>

</div>

<script>
    window.onload = function() {
        document.getElementById('sb-url').value = localStorage.getItem('domus_sb_url') || '';
        document.getElementById('sb-key').value = localStorage.getItem('domus_sb_key') || '';
        
        if (localStorage.getItem('domus_sb_url') && localStorage.getItem('domus_sb_key')) {
            fetchLogs();
        }
    };

    function saveConfig() {
        localStorage.setItem('domus_sb_url', document.getElementById('sb-url').value.trim());
        localStorage.setItem('domus_sb_key', document.getElementById('sb-key').value.trim());
        alert("Credenziali Supabase memorizzate nel browser!");
        fetchLogs();
    }

    async function fetchLogs() {
        const url = localStorage.getItem('domus_sb_url');
        const key = localStorage.getItem('domus_sb_key');

        if (!url || !key) {
            alert("Inserisci e salva prima le credenziali di Supabase nel box in basso!");
            return;
        }

        const tbody = document.getElementById("log-table-body");
        const loadingBox = document.getElementById("loading-status");
        
        loadingBox.style.display = 'block';
        tbody.innerHTML = `<tr><td colspan="4" class="center">Caricamento log in corso...</td></tr>`;

        try {
            const response = await fetch(`${url}/rest/v1/logs?select=*&order=id.desc`, {
                headers: {
                    "apikey": key,
                    "Authorization": `Bearer ${key}`
                }
            });

            if (!response.ok) {
                throw new Error(`Errore HTTP: ${response.status}`);
            }

            const data = await response.json();
            loadingBox.style.display = 'none';
            
            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="center">Nessun log trovato nel database.</td></tr>`;
                return;
            }

            let html = "";
            data.forEach(log => {
                let dataFormattata = '-';
    
                if (log.created_at) {
                    const d = new Date(log.created_at);
                    const giorno = String(d.getDate()).padStart(2, '0');
                    const mese = String(d.getMonth() + 1).padStart(2, '0');
                    const anno = d.getFullYear();
                    const ore = String(d.getHours()).padStart(2, '0');
                    const minuti = String(d.getMinutes()).padStart(2, '0');
                    const secondi = String(d.getSeconds()).padStart(2, '0');
        
                    dataFormattata = `${giorno}-${mese}-${anno} ${ore}:${minuti}:${secondi}`;
                }

                html += `
                    <tr>
                        <!-- <td>${log.id}</td> -->
                        <td>${dataFormattata}</td>
                        <td class="center">${log.severity || '⚪'}</td>
                        <td>${log.event_message || '-'}</td>
                    </tr>
                `;
            });

            tbody.innerHTML = html;

        } catch (error) {
            loadingBox.style.display = 'none';
            console.error("Errore nel recupero dei log:", error);
            tbody.innerHTML = `<tr><td colspan="4" class="center" style="color: red;">Errore di connessione a Supabase (Verifica URL e Chiave)</td></tr>`;
        }
    }
</script>

</body>
</html>
