<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM-US - Log Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }
        th {
            background-color: #2c3e50;
            color: white;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
        .center {
            text-align: center;
            font-size: 1.2em;
        }
        .refresh-btn {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1em;
            cursor: pointer;
            margin-top: 15px;
        }
        .refresh-btn:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🛡️ DOM-US System Logs</h1>
    <button class="refresh-btn" onclick="fetchLogs()">Aggiorna Log</button>
    
    <table>
        <thead>
            <tr>
                <th style="width: 10%;">ID</th>
                <th style="width: 25%;">Timestamp</th>
                <th style="width: 15%; text-align: center;">Stato</th>
                <th>Messaggio Evento</th>
            </tr>
        </thead>
        <tbody id="log-table-body">
            <tr><td colspan="4" class="center">Caricamento log in corso...</td></tr>
        </tbody>
    </table>
</div>

<script src="config.js"></script>
<script>
    async function fetchLogs() {
        const tbody = document.getElementById("log-table-body");
        tbody.innerHTML = `<tr><td colspan="4" class="center">Aggiornamento...</td></tr>`;

        try {
            const response = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/logs?select=*&order=id.desc`, {
                headers: {
                    "apikey": CONFIG.SUPABASE_KEY,
                    "Authorization": `Bearer ${CONFIG.SUPABASE_KEY}`
                }
            });

            if (!response.ok) {
                throw new Error(`Errore HTTP: ${response.status}`);
            }

            const data = await response.json();
            
            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="center">Nessun log trovato nel database.</td></tr>`;
                return;
            }

            let html = "";
            data.forEach(log => {
                html += `
                    <tr>
                        <td>${log.id}</td>
                        <td>${log.created_at || '-'}</td>
                        <td class="center">${log.color || '⚪'}</td>
                        <td>${log.message || '-'}</td>
                    </tr>
                `;
            });

            tbody.innerHTML = html;

        } catch (error) {
            console.error("Errore nel recupero dei log:", error);
            tbody.innerHTML = `<tr><td colspan="4" class="center" style="color: red;">Errore di connessione a Supabase</td></tr>`;
        }
    }

    fetchLogs();
</script>

</body>
</html>
